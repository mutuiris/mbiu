name: Deploy

on:
  push:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # The frontend deploys through Vercel's Git integration (production branch: prod).
  api:
    needs: ci
    # Skipped until the Google Cloud variables are set on the production environment
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write # keyless login to Google Cloud (Workload Identity Federation)
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/mbiu/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Build and push the API image
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          echo "$TOKEN" | docker login -u oauth2accesstoken --password-stdin "$REGISTRY"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: mbiu-api
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
