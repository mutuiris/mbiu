name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Test
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Off until the production secrets exist: set the repo variable DEPLOY_ENABLED=true
  migrate:
    name: Migrate database
    needs: ci
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ALLOWED_HOSTS: localhost
      # Direct connection (session pooler): migrations don't run through a pooler
      DATABASE_URL: ${{ secrets.DATABASE_DIRECT_URL }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
      - run: uv sync --locked --no-dev
      - name: Generate a Django secret key
        run: echo "DJANGO_SECRET_KEY=$(uv run python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
      - run: uv run python manage.py migrate

  api:
    name: Deploy API (Render)
    needs: migrate
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Trigger the Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          response=$(curl --fail --silent --show-error --request POST "$HOOK")
          deploy_id=$(echo "$response" | jq -r '.deploy.id // "unknown"')
          echo "Render deploy $deploy_id triggered"
          {
            echo "### API deploy triggered on Render"
            echo "Deploy: \`$deploy_id\` from \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Deploy web (Vercel)
    # After the API, so the new frontend never talks to the old API
    needs: api
    runs-on: ubuntu-24.04
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: npm install --global vercel@65.2.0
      # The Vercel project's Root Directory is frontend, so the CLI runs from the repo root.
      # Its environment variables (API URL, Turnstile site key) come from the Vercel project.
      - name: Build and deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed to $url"
          {
            echo "### Frontend deployed on Vercel"
            echo "$url from \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  released:
    name: Released
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "### Released \`${GITHUB_SHA::7}\` to production" >> "$GITHUB_STEP_SUMMARY"
