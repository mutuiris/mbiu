version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    commit-message: { prefix: ci }
    groups: { actions: { patterns: ["*"] } }

  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    commit-message: { prefix: build, include: scope }
    groups: { backend: { update-types: [minor, patch] } }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    commit-message: { prefix: build, include: scope }
    groups: { frontend: { update-types: [minor, patch] } }
    ignore:
      # Types must match our Node 24 runtime
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    commit-message: { prefix: build, include: scope }
    ignore:
      # uv is pinned in both the Dockerfile and ci.yml; update them together by hand
      - dependency-name: "astral-sh/uv"
