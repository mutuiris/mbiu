# Extends gitleaks' default rules.
[extend]
useDefault = true

[allowlist]
description = "Allowlist false positives on corpus chunk identifiers"
regexTarget = "line"
regexes = [
    '''chunk_key\s*=\s*["'][A-Z0-9]+(?:-[A-Z0-9]+)+["']''',
    '''chunk_key\s*=\s*["'](KE-[A-Z0-9\-]+|DUPLICATE-\d+|DISTINCT-\d+)["']''',
]
paths = [
    '''backend/mbiu/corpus/pipeline/runner\.py''',
    '''backend/tests/test_corpus_pipeline\.py''',
]
