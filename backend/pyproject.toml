[project]
name = "mbiu"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "django==6.1.2",
    "google-genai==2.31.0",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "psycopg[binary]==3.3.6",
    "pybreaker==1.4.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "pymupdf>=2.0",
    "tenacity==9.1.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "django-stubs==6.1.2",
    "hypothesis==6.170.5",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "ruff==0.17.0",
]

[tool.uv]
package = false
# Only resolve versions published at least 14 days ago
exclude-newer = "14 days"
# Security exception: pyasn1 < 0.6.5 (via google-auth) has CVE-2026-119194 to -119197.
# Remove both lines after 2026-11-10.
constraint-dependencies = ["pyasn1>=0.6.5"]
exclude-newer-package = { pyasn1 = "2026-10-28T00:00:00Z" }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20", "D101", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "psutil", "psutil.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
django_find_project = false
pythonpath = ["."]
