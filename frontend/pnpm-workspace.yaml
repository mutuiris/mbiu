# Only install versions published at least 14 days ago (in minutes)
minimumReleaseAge: 20160
saveExact: true
engineStrict: true
# Dependency install scripts are blocked unless listed. unrs-resolver's script is only a
# fallback downloader; its prebuilt binary installs normally.
allowBuilds:
  unrs-resolver: false
# @hey-api/json-schema-ref-parser pins js-yaml 4.2.0, which has DoS advisories
# (GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh). Remove once it ships >= 4.3.2.
overrides:
  "@hey-api/json-schema-ref-parser>js-yaml": 4.3.2
