      "contract_clause_block": "1.1 Parties\nThis Recording Agreement is made between the Artist and the Company on the Effective Date stated at the end of this Agreement.\n\n2.1 Term\nThe Term of this Agreement begins on the Effective Date and continues for two (2) years, unless it is terminated earlier in accordance with this Agreement.\n\n3.1 Grant of Rights\nThe Artist irrevocably assigns to the Company all right, title and interest in the Recordings, the Masters and all related rights in perpetuity throughout the universe, including all renewals and extensions. The Artist retains no ownership in the Recordings or the Masters.\n\n3.2 Ownership\nThe Company owns the master recordings created under this Agreement. The Artist retains ownership of the musical compositions and the right to receive royalties.\n\n4.1 Royalties\nThe Company shall pay the Artist a royalty of twenty per cent (20%) of Gross Receipts after deducting all recording, marketing, distribution, administration and overhead costs, and after recoupment of any advances paid to the Artist.\n\n4.2 Payment Dates\nThe Company shall account to the Artist for royalties from time to time in the manner the Company considers appropriate. Payment shall be made when the Company is able to do so, and no statement or payment date is fixed by this Agreement.\n\n4.3 Accounting\nThe Company shall keep complete books and records of Gross Receipts and shall allow the Artist to inspect them once each year on reasonable notice.\n\n5.1 Exclusivity\nThe Artist shall work exclusively with the Company during the Term and for five (5) years after the expiry or termination of the Term, and shall not record for, perform for or grant any rights to any other label during that period.\n\n6.1 Termination\nEither party may terminate this Agreement on thirty (30) days written notice if the other party commits a material breach and does not cure it within that period.\n\n7.1 Renewal\nNotwithstanding clause 2.1, the Term of this Agreement is five (5) years from the Effective Date and renews automatically for further five (5) year periods unless notice is given.\n\n8.1 Governing Law\nThis Agreement is governed by the laws of Kenya and the courts of Kenya have exclusive jurisdiction over any dispute about it.\n\n9.1 Notices\nNotices under this Agreement must be in writing and delivered to the addresses given by the parties in clause 1.1.\n\n10.1 Entire Agreement\nThis Agreement is the entire agreement between the parties about the Recordings and replaces all earlier understandings on that subject."
