description: "MB-19 golden set quality gate - no planted risk may pass unflagged"

prompts:
  - file://generator/prompts/mbiu_clause_eval.txt

providers:
  - id: python:generator/provider.py
    label: mbiu-clause-eval
    config:
      mode: auto
      model: gemini-2.5-flash

# Generated by `python -m evals.generator.build`; JSON is valid YAML.
tests: file://datasets/promptfoo_tests.yaml

sharing: false

defaultTest:
  assert:
    - type: is-json
      metric: structured-output
    - type: python
      value: file://generator/assertion.py
      metric: quality-gate

evaluateOptions:
  maxConcurrency: 2
